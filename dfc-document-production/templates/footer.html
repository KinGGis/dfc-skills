<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;font-family:"Calibri","Carlito","Arial",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .f{padding:0 18mm;border-top:0.5pt solid #D9D9D6;padding-top:2mm;overflow:hidden;font-size:8pt;color:#6E6E6E;}
  .f .l{float:left;}
  .f .r{float:right;font-weight:700;color:#1C1C1C;}
</style></head>
<body onload="subst()">
  <script>
  function subst(){var v={};var q=document.location.search.substring(1).split('&');for(var i in q){var p=q[i].split('=',2);v[p[0]]=unescape(p[1]);}var e=document.getElementsByClassName('page');for(var j=0;j<e.length;j++){e[j].textContent=v['page'];}}
  </script>
  <div class="f"><span class="l">__FOOTER_LEFT__</span><span class="r"><span class="page"></span></span></div>
</body></html>
