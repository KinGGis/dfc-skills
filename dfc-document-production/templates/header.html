<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;font-family:"Calibri","Carlito","Arial",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .bar{height:3mm;width:100%;}
  .bar .g{float:left;width:42%;height:3mm;background:#C5A253;}
  .bar .b{float:left;width:58%;height:3mm;background:#1C1C1C;}
  .row{padding:3mm 18mm 0 18mm;overflow:hidden;}
  .row .logo{float:left;}
  .row .logo img{height:11mm;}
  .row .txt{float:right;text-align:right;padding-top:1mm;}
  .row .txt .n{font-size:9pt;font-weight:700;color:#1C1C1C;text-transform:uppercase;letter-spacing:0.3pt;}
  .row .txt .s{font-size:8pt;color:#6E6E6E;margin-top:1pt;}
</style></head>
<body>
  <div class="bar"><div class="g"></div><div class="b"></div></div>
  <div class="row">
    <div class="logo"><img src="data:image/png;base64,__LOGO_DARK__"></div>
    <div class="txt"><div class="n">__HEADER_RIGHT1__</div><div class="s">__HEADER_RIGHT2__</div></div>
  </div>
</body></html>
