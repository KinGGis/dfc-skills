sections:
  - heading: "1. Synthèse de l'arrêté"
    subhead: "Le chiffre qui engage le mois"
    kpis:
      - ["1 051,62 £", "Prix de l'action, août 2026"]
      - ["+5,162 %", "Variation de la NAV sur le mois"]
      - ["3 765,18 £", "NAV opérationnelle nette"]
    body: |
      La valeur liquidative du portefeuille opérationnel de DualForce Capital Ltd est arrêtée au 31 août 2026 à **3 765,18 £**, contre 3 580,35 £ au 31 juillet 2026. La progression du mois s'établit à **+5,162 %**, soit +184,83 £, après provision des frais de gestion et neutralisation des souscriptions.

      Appliquée à la valeur de référence de 1 000,00 £ retenue au lancement du programme, cette variation porte le prix de l'action à **1 051,62 £**.
    retain: |
      La performance du mois provient très majoritairement de la poche Actions, qui apporte 138,94 £ sur les 184,83 £ de variation. Aucun incident de crédit, aucune dépréciation.
